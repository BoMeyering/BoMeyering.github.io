<section id="skillset">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">My Skillset</h2>
                <hr class="primary">
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            {% for skill in site.data.skills %}
            <div class="col-lg-3 col-sm-6 text-center">
                <div class="service-box">
                    <a href="{{ skill.url }}" target="_blank" rel="noopener">
                        <img class="img-logo wow bounceIn logo" height="100" data-wow-delay="{{ forloop.index0 | modulo: 4 | times: 0.1 }}s" src="{{ skill.logo }}" alt="{{ skill.name }} logo">
                        <h3>{{ skill.name }}</h3>
                    </a>
                    <p class="text-muted">{{ skill.blurb }}</p>
                </div>
            </div>
            {% cycle '', '<div class="clearfix visible-sm-block visible-md-block"></div>', '', '<div class="clearfix visible-sm-block visible-md-block visible-lg-block"></div>' %}
            {% endfor %}
        </div>
    </div>
</section>
