<section class="bg-primary" id="experience">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 text-center">
                <h2 class="section-heading">Experience</h2>
                <hr class="light">
            </div>
        </div>
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2">
                {% for job in site.data.experience %}
                <div class="experience-item wow fadeInUp" data-wow-delay="{{ forloop.index0 | times: 0.05 }}s">
                    <h3>{{ job.title }} <span class="experience-org">· {{ job.org }}</span></h3>
                    <p class="experience-meta">{{ job.dates }} &nbsp;|&nbsp; {{ job.location }}</p>
                    <p class="text-faded">{{ job.summary }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
